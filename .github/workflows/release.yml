name: release

# Pushing a tag like v0.2.0 tests the extension, packages it once, and publishes that package to the
# VS Code Marketplace and Open VSX. Both publish jobs wait for approval in the `release` environment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  marketplace:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Trusted Publishing: no stored token
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v8.0.2
        with:
          name: hunch-vsix
      - run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath *.vsix

  open-vsx:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v8.0.2
        with:
          name: hunch-vsix
      # A token until the sigmoid-ide namespace is verified, then Trusted Publishing.
      - run: npx --yes ovsx@1.3.0 publish --skip-duplicate --packagePath *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  github-release:
    needs: [marketplace, open-vsx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: hunch-vsix
      - run: gh release create "$GITHUB_REF_NAME" *.vsix --repo "$GITHUB_REPOSITORY" --title "Hunch for VS Code ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
